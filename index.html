<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUROI KASEP - SAKURA EDITION</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(180deg, #1a0a1f 0%, #2d1035 50%, #0a0011 100%);
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial Black', sans-serif;
    position: relative;
  }

  /* ===== BACKGROUND SAKURA ===== */
  .sakura-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .petal {
    position: absolute;
    top: -50px;
    font-size: 22px;
    color: #ffb7d5;
    text-shadow: 0 0 8px #ff69b4, 0 0 15px #ff1493;
    animation: fall linear infinite;
    opacity: 0.9;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10vh) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(110vh) translateX(80px) rotate(720deg);
      opacity: 0;
    }
  }

  /* ===== KONTEN TENGAH ===== */
  .stage {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 1rem;
  }

  .word {
    font-size: clamp(2rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow:
      0 0 10px #fff,
      0 0 20px #ffb7d5,
      0 0 40px #ff69b4,
      0 0 80px #ff1493;
    white-space: nowrap;
    position: absolute;
    opacity: 0;
  }

  .word.left {
    animation: comeFromLeft 4s ease-in-out infinite;
  }

  .word.right {
    animation: comeFromRight 4s ease-in-out infinite;
  }

  /* Animasi masuk dari kiri, menyatu di tengah, hilang */
  @keyframes comeFromLeft {
    0%   { transform: translateX(-60vw); opacity: 0; filter: blur(8px); }
    25%  { transform: translateX(0);     opacity: 1; filter: blur(0); }
    45%  { transform: translateX(0);     opacity: 1; filter: blur(0); }
    60%  { transform: translateX(0);     opacity: 1; filter: blur(0); }
    80%  { transform: translateX(0);     opacity: 0; filter: blur(10px); }
    100% { transform: translateX(-60vw); opacity: 0; filter: blur(8px); }
  }

  @keyframes comeFromRight {
    0%   { transform: translateX(60vw);  opacity: 0; filter: blur(8px); }
    25%  { transform: translateX(0);     opacity: 1; filter: blur(0); }
    45%  { transform: translateX(0);     opacity: 1; filter: blur(0); }
    60%  { transform: translateX(0);     opacity: 1; filter: blur(0); }
    80%  { transform: translateX(0);     opacity: 0; filter: blur(10px); }
    100% { transform: translateX(60vw);  opacity: 0; filter: blur(8px); }
  }

  /* Teks menyatu */
  .merge {
    position: absolute;
    font-size: clamp(2rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow:
      0 0 20px #fff,
      0 0 40px #ffb7d5,
      0 0 80px #ff69b4,
      0 0 120px #ff1493;
    opacity: 0;
    animation: mergeGlow 4s ease-in-out infinite;
  }

  @keyframes mergeGlow {
    0%, 20% { opacity: 0; transform: scale(0.8); filter: blur(10px); }
    35%     { opacity: 1; transform: scale(1.1); filter: blur(0); }
    50%     { opacity: 1; transform: scale(1); filter: blur(0); }
    65%     { opacity: 1; transform: scale(1.1); filter: blur(0); }
    80%     { opacity: 0; transform: scale(1.3); filter: blur(15px); }
    100%    { opacity: 0; transform: scale(0.8); filter: blur(10px); }
  }
</style>
</head>
<body>

<!-- LAYER SAKURA -->
<div class="sakura-layer" id="sakuraLayer"></div>

<!-- STAGE TENGAH -->
<div class="stage">
  <div class="word left">KUROI</div>
  <div class="word right">KASEP</div>
  <div class="merge">KUROI KASEP</div>
</div>

<script>
  // Bikin kelopak sakura berguguran
  const layer = document.getElementById('sakuraLayer');
  const petals = ['🌸', '🌸', '🌸', '❀', '✿'];

  function createPetal() {
    const p = document.createElement('div');
    p.classList.add('petal');
    p.textContent = petals[Math.floor(Math.random() * petals.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (Math.random() * 20 + 14) + 'px';
    p.style.animationDuration = (Math.random() * 6 + 6) + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    p.style.opacity = Math.random() * 0.5 + 0.5;
    layer.appendChild(p);

    // Hapus setelah selesai animasi biar gak numpuk
    setTimeout(() => p.remove(), 15000);
  }

  // Bikin terus-menerus
  setInterval(createPetal, 250);
  // Bikin awal sekaligus banyak
  for (let i = 0; i < 30; i++) createPetal();
</script>

</body>
</html>
