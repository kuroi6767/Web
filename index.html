<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUROI KASEP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #1a0033 0%, #0a0011 70%, #000 100%);
    font-family: 'Arial Black', 'Segoe UI', sans-serif;
  }

  /* ===== SAKURA BACKGROUND ===== */
  .sakura-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    contain: strict;
  }

  .petal {
    position: absolute;
    top: -40px;
    font-size: 20px;
    color: #ffb7d5;
    text-shadow: 0 0 8px #ff69b4;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translate3d(80px, 110vh, 0) rotate(720deg); opacity: 0; }
  }

  /* ===== STAGE ===== */
  .stage {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    gap: 1rem;
  }

  /* ===== TEKS TIKTOK STYLE ===== */
  .word {
    position: absolute;
    font-size: clamp(2.5rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 10px #fff,
      0 0 20px #d400ff,
      0 0 40px #a020f0,
      0 0 80px #7a00cc;
    white-space: nowrap;
    opacity: 0;
    will-change: transform, opacity, filter;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
  }

  .word.left  { animation: comeLeft  4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  .word.right { animation: comeRight 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

  @keyframes comeLeft {
    0%   { transform: translate3d(-70vw, 0, 0) scale(0.9); opacity: 0; filter: blur(8px); }
    25%  { transform: translate3d(0, 0, 0) scale(1.1);      opacity: 1; filter: blur(0); }
    45%  { transform: translate3d(0, 0, 0) scale(1);        opacity: 1; filter: blur(0); }
    65%  { transform: translate3d(0, 0, 0) scale(1.05);     opacity: 1; filter: blur(0); }
    85%  { transform: translate3d(0, 0, 0) scale(1.3);      opacity: 0; filter: blur(12px); }
    100% { transform: translate3d(-70vw, 0, 0) scale(0.9);  opacity: 0; filter: blur(8px); }
  }

  @keyframes comeRight {
    0%   { transform: translate3d(70vw, 0, 0) scale(0.9);  opacity: 0; filter: blur(8px); }
    25%  { transform: translate3d(0, 0, 0) scale(1.1);      opacity: 1; filter: blur(0); }
    45%  { transform: translate3d(0, 0, 0) scale(1);        opacity: 1; filter: blur(0); }
    65%  { transform: translate3d(0, 0, 0) scale(1.05);     opacity: 1; filter: blur(0); }
    85%  { transform: translate3d(0, 0, 0) scale(1.3);      opacity: 0; filter: blur(12px); }
    100% { transform: translate3d(70vw, 0, 0) scale(0.9);   opacity: 0; filter: blur(8px); }
  }

  /* ===== TEKS MENYATU ===== */
  .merge {
    position: absolute;
    font-size: clamp(2.5rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 20px #fff,
      0 0 40px #d400ff,
      0 0 80px #a020f0,
      0 0 120px #7a00cc;
    opacity: 0;
    will-change: transform, opacity, filter;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    animation: mergeGlow 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }

  @keyframes mergeGlow {
    0%, 25% { opacity: 0; transform: scale(0.6); filter: blur(15px); }
    40%     { opacity: 1; transform: scale(1.15); filter: blur(0); }
    55%     { opacity: 1; transform: scale(1); filter: blur(0); }
    70%     { opacity: 1; transform: scale(1.15); filter: blur(0); }
    85%     { opacity: 0; transform: scale(1.5); filter: blur(20px); }
    100%    { opacity: 0; transform: scale(0.6); filter: blur(15px); }
  }

  /* ===== GLITCH RGB SPLIT ===== */
  .word::before,
  .word::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    pointer-events: none;
  }

  .word::before {
    color: #ff00ff;
    z-index: -1;
    animation: glitchBefore 4s infinite;
  }

  .word::after {
    color: #00ffff;
    z-index: -2;
    animation: glitchAfter 4s infinite;
  }

  @keyframes glitchBefore {
    0%, 90%, 100% { transform: translate3d(0, 0, 0); }
    92%           { transform: translate3d(-4px, -2px, 0); }
    94%           { transform: translate3d(4px, 2px, 0); }
    96%           { transform: translate3d(-2px, 3px, 0); }
  }

  @keyframes glitchAfter {
    0%, 90%, 100% { transform: translate3d(0, 0, 0); }
    92%           { transform: translate3d(4px, 2px, 0); }
    94%           { transform: translate3d(-4px, -2px, 0); }
    96%           { transform: translate3d(2px, -3px, 0); }
  }
</style>
</head>
<body>

<div class="sakura-layer" id="sakuraLayer"></div>

<div class="stage">
  <div class="word left"  data-text="KUROI">KUROI</div>
  <div class="word right" data-text="KASEP">KASEP</div>
  <div class="merge">KUROI KASEP</div>
</div>

<script>
  // Bikin sakura smooth pake DocumentFragment biar gak lag
  const layer = document.getElementById('sakuraLayer');
  const petals = ['🌸', '🌸', '🌸', '❀', '✿'];
  const MAX_PETALS = 25;

  function createPetal() {
    if (layer.childElementCount >= MAX_PETALS) return;
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[(Math.random() * petals.length) | 0];
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.fontSize = ((Math.random() * 18 + 14) | 0) + 'px';
    p.style.animationDuration = ((Math.random() * 6 + 6) | 0) + 's';
    p.style.animationDelay = (Math.random() * 4) + 's';
    layer.appendChild(p);

    p.addEventListener('animationend', () => p.remove());
  }

  // Set interval lebih lambat biar gak numpuk
  setInterval(createPetal, 500);
  for (let i = 0; i < 15; i++) createPetal();

  // Pause animasi kalau tab gak aktif (hemat resource)
  document.addEventListener('visibilitychange', () => {
    document.querySelectorAll('.petal, .word, .merge').forEach(el => {
      el.style.animationPlayState = document.hidden ? 'paused' : 'running';
    });
  });
</script>

</body>
</html>
